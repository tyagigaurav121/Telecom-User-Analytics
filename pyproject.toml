[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-user-analytics"
version = "1.0.0"
description = "Reusable telecom customer engagement, experience and satisfaction analytics"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7", "seaborn>=0.12", "openpyxl>=3.1", "joblib>=1.3"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
test = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
